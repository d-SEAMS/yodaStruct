[workspace]
name = "dseams-lua"
version = "2.14.0"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
compilers = ">=1.9.0,<2"
meson = ">=1.3.0"
ninja = ">=1.13.2,<2"
pkgconfig = ">=1.5.5,<2"
python = "3.12.*"
eigen = "3.4.0.*"
libblas = ">=3.11.0,<4"
liblapack = ">=3.11.0,<4"
libhwy = ">=1.3.0"
chemfiles = ">=0.10"
# linkcell, minimage and readcon need cargo.
rust = ">=1.80"
lua = ">=5.4,<5.5"
luarocks = ">=3.11,<3.13"
towncrier = "==23.11.0"

[pypi-dependencies]
# seams-core registers capi_crosscheck, which compares libseams with
# freud and OVITO, in a subproject build too.
freud-analysis = ">=3.6.1,<4"
ovito = ">=3.12.0,<4"

[target.linux-64.dependencies]
luajit = ">=2.1"

[tasks]
fennel = "sh scripts/fetch_fennel.sh .cache/fennel"
setup = { cmd = "meson setup bbdir -Dfennel_lua=$PIXI_PROJECT_ROOT/.cache/fennel/fennel-1.5.3.lua", depends-on = ["fennel"] }
build = { cmd = "meson compile -C bbdir", depends-on = ["setup"] }
test = { cmd = "meson test -C bbdir --print-errorlogs", depends-on = ["build"] }
