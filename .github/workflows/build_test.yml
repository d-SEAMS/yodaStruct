name: Build yodaStruct and test
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
jobs:
  build_test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-name: yoda
          create-args: >-
            cxx-compiler
            meson
            ninja
            pkg-config
            eigen
            libblas
            liblapack
            lua=5.4
            luarocks=3.12.2=lua54*
            cmake
            libsqlite
            rust
          cache-environment: true
      # conda-forge has no Lua 5.4 build of luarocks 3.13.0, so an unpinned
      # luarocks resolves to the LuaJIT build. LuaJIT cannot load the
      # luarocks.org manifest (more than 65536 constants in one chunk), and
      # the rockspec's fennel dependency is then unresolvable.
      - name: LuaRocks runs on Lua 5.4
        shell: bash -el {0}
        run: |
          set -euxo pipefail
          luarocks --version
          lr_lua=$(luarocks config variables.LUA)
          "$lr_lua" -e 'assert(_VERSION == "Lua 5.4", _VERSION); assert(jit == nil, "LuaJIT")'
      - name: Configure and build
        shell: bash -el {0}
        run: |
          meson subprojects download seams-core
          cp subprojects/seams-core/subprojects/linkcell.wrap subprojects/
          mkdir -p subprojects/packagefiles
          cp subprojects/seams-core/subprojects/packagefiles/linkcell-conda-openmp.patch subprojects/packagefiles/
          meson subprojects download linkcell
          meson setup bbdir --prefix=/usr --libdir=lib --wrap-mode=nodownload -Dauto_features=disabled
          meson compile -C bbdir
      - name: Tests
        shell: bash -el {0}
        run: |
          set -euxo pipefail
          meson test -C bbdir -v --print-errorlogs
          if grep -Eq '^Skipped:[[:space:]]+[1-9]' bbdir/meson-logs/testlog.txt; then
            echo 'meson test skipped tests' >&2
            exit 1
          fi
          test "$(grep -c '^missing input/readers/' bbdir/meson-logs/testlog.txt)" -eq 4
      - name: Test staged install
        shell: bash -el {0}
        run: |
          DESTDIR="$PWD/stage" meson install -C bbdir
          export LUA_PATH="$PWD/stage/usr/share/luadseams/lua/?.lua;;"
          export LUA_CPATH="$PWD/stage/usr/lib/?.so;;"
          export DSEAMS_INSTALL_ROOT="$PWD/stage"
          lua example_lua/library/installed.lua
      - name: Test LuaRocks local-tree install
        shell: bash -el {0}
        run: |
          set -euxo pipefail
          luarocks --lua-version=5.4 make --tree "$PWD/.luarocks" rockspec
          luarocks --lua-version=5.4 --tree "$PWD/.luarocks" list --porcelain
          luarocks --lua-version=5.4 --tree "$PWD/.luarocks" list --porcelain fennel | grep -E '^fennel[[:space:]]+1\.'
          eval "$(luarocks --lua-version=5.4 path --tree "$PWD/.luarocks")"
          lua -e 'local tree = os.getenv("PWD") .. "/.luarocks/"; local fennel_file = assert(package.searchpath("fennel", package.path)); assert(fennel_file:sub(1, #tree) == tree, fennel_file .. " is not in the rock tree"); local major, minor, patch = require("fennel").version:match("^(%d+)%.(%d+)%.(%d+)"); major, minor, patch = tonumber(major), tonumber(minor), tonumber(patch); assert(major == 1 and (minor > 5 or (minor == 5 and patch >= 3)), "fennel " .. require("fennel").version); print("fennel " .. require("fennel").version .. " from " .. fennel_file)'
          lua -e 'local d = require("dseams"); require("yoda"); local fennel = require("fennel"); local lua_file = assert(package.searchpath("dseams", package.path)); local fnl_file = lua_file:gsub("dseams%.lua$", "dseams.fnl"); local wrapped = fennel.dofile(fnl_file); assert(type(wrapped["chill-plus"]) == "function"); local cloud = d.core.readXYZ("example_lua/full_api/cube.xyz"); assert(cloud.nop > 0)'

  lua_abi:
    name: Lua ${{ matrix.lua }} beside the other Lua
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lua: ['5.3', '5.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Lua 5.3 and 5.4 together
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 liblua5.3-dev lua5.4 liblua5.4-dev \
            meson ninja-build pkg-config g++ libeigen3-dev libblas-dev liblapack-dev
      - name: Configure, build, and test against Lua ${{ matrix.lua }}
        run: |
          set -euxo pipefail
          meson setup bbdir -Dauto_features=disabled -Dlua_version=${{ matrix.lua }}
          meson compile -C bbdir
          readelf -d bbdir/dseams_core.so | grep -F "liblua${{ matrix.lua }}.so"
          meson test -C bbdir -v --print-errorlogs
          if grep -Eq '^Skipped:[[:space:]]+[1-9]' bbdir/meson-logs/testlog.txt; then
            echo 'meson test skipped tests' >&2
            exit 1
          fi
          grep -F 'abi_match interpreter=${{ matrix.lua }} linked=${{ matrix.lua }}' bbdir/meson-logs/testlog.txt

  readers:
    name: chemfiles and readcon
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-name: yoda
          create-args: >-
            cxx-compiler
            meson
            ninja
            pkg-config
            eigen
            libblas
            liblapack
            lua=5.4
            cmake
            libsqlite
            openssl
            make
          cache-environment: true
      - name: Configure, require both readers, and test
        shell: bash -el {0}
        run: |
          set -euxo pipefail
          meson setup bbdir --prefix=/usr --libdir=lib \
            -Dseams-core:with_chemfiles=enabled -Dseams-core:use_vendored_chemfiles=enabled \
            -Dseams-core:with_readcon=enabled \
            -Dwith_chemfiles=enabled -Dwith_readcon=enabled
          meson compile -C bbdir
          export LUA_PATH="$PWD/lua/?.lua;;"
          export LUA_CPATH="$PWD/bbdir/?.so;;"
          lua -e 'local d = require("dseams"); assert(d.has_chemfiles() == true); assert(d.has_readcon() == true)'
          meson test -C bbdir -v --print-errorlogs
          if grep -Eq '^Skipped:[[:space:]]+[1-9]' bbdir/meson-logs/testlog.txt; then
            echo 'meson test skipped tests' >&2
            exit 1
          fi
          for f in cuh2.con water.dcd water.gro water.pdb; do
            grep -E "^read input/readers/$f nop=" bbdir/meson-logs/testlog.txt
          done
      - name: Load the installed module with both readers
        shell: bash -el {0}
        run: |
          DESTDIR="$PWD/stage-readers" meson install -C bbdir --no-rebuild
          export LUA_PATH="$PWD/stage-readers/usr/share/luadseams/lua/?.lua;;"
          export LUA_CPATH="$PWD/stage-readers/usr/lib/?.so;;"
          env -u LD_LIBRARY_PATH lua -e 'local d = require("dseams"); assert(d.has_chemfiles()); assert(d.has_readcon())'
      - name: Configure with readers disabled and prove runtime disable
        shell: bash -el {0}
        run: |
          set -euxo pipefail
          meson setup bbdir-disabled --prefix=/usr --libdir=lib \
            -Dseams-core:with_chemfiles=enabled -Dseams-core:use_vendored_chemfiles=enabled \
            -Dseams-core:with_readcon=enabled \
            -Dwith_chemfiles=disabled -Dwith_readcon=disabled
          meson compile -C bbdir-disabled
          export LUA_PATH="$PWD/lua/?.lua;;"
          export LUA_CPATH="$PWD/bbdir-disabled/?.so;;"
          lua -e 'local d=require("dseams"); assert(d.has_chemfiles()==false); assert(d.has_readcon()==false); local okc, errc = pcall(d.read, "input/readers/water.dcd", {frame=1}); assert(okc == false and tostring(errc):find("chemfiles missing", 1, true) ~= nil); local okr, errr = pcall(d.read, "input/readers/cuh2.con", {frame=1}); assert(okr == false and tostring(errr):find("readcon-core missing", 1, true) ~= nil)'
          meson test -C bbdir-disabled -v --print-errorlogs --suite readers
          if grep -Eq '^Skipped:[[:space:]]+[1-9]' bbdir-disabled/meson-logs/testlog.txt; then
            echo 'meson test skipped tests' >&2
            exit 1
          fi
          for f in cuh2.con water.dcd water.gro water.pdb; do
            grep -E "^missing input/readers/$f " bbdir-disabled/meson-logs/testlog.txt
          done
