name: Build and test
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  LUAROCKS_VERSION: "3.12.2"
  LUAROCKS_SHA256: b0e0c85205841ddd7be485f53d6125766d18a81d226588d2366931e9a1484492

jobs:
  versions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Versions follow meson.build
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(".")
          want = re.search(r"version: '([^']+)'", (root / "meson.build").read_text()).group(1)
          bad = []
          rock = root / f"dseams-{want}-1.rockspec"
          if not rock.is_file():
              bad.append(f"{rock} is missing")
          elif f'version = "{want}-1"' not in rock.read_text():
              bad.append(f"{rock} version")
          for path, pattern in {
              "CITATION.cff": r'(?m)^version: "([^"]+)"',
              "nix/package.nix": r'(?m)^  version = "([^"]+)"',
          }.items():
              got = re.search(pattern, (root / path).read_text()).group(1)
              if got != want:
                  bad.append(f"{path}: {got}")
          sys.exit("meson.build is {}; {}".format(want, "; ".join(bad)) if bad else 0)
          PY

  meson:
    name: meson ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            luajit: luajit
          - os: macos-latest
            luajit: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-name: dseams
          create-args: >-
            c-compiler
            cxx-compiler
            meson
            ninja
            pkg-config
            python=3.12
            eigen
            libblas
            liblapack
            libhwy
            chemfiles
            rust
            lua=5.4
            luarocks
            ${{ matrix.luajit }}
          cache-environment: true
      - name: Fennel and busted
        shell: bash -el {0}
        run: |
          echo "FENNEL_LUA=$(sh scripts/fetch_fennel.sh "$RUNNER_TEMP/fennel")" >> "$GITHUB_ENV"
          luarocks --lua-version 5.4 install --tree "$CONDA_PREFIX" busted
      - name: Configure and build
        shell: bash -el {0}
        run: |
          meson setup bbdir --prefix="$RUNNER_TEMP/prefix" --libdir=lib \
            -Dwith_lua=enabled -Dfennel_lua="$FENNEL_LUA"
          meson compile -C bbdir
      - name: Tests
        shell: bash -el {0}
        run: meson test -C bbdir --print-errorlogs
      - name: Installed module
        shell: bash -el {0}
        run: |
          meson install -C bbdir
          prefix="$RUNNER_TEMP/prefix"
          export OMP_NUM_THREADS=1 LD_LIBRARY_PATH="$prefix/lib" DYLD_LIBRARY_PATH="$prefix/lib"
          LUA_PATH="$prefix/share/lua/5.4/?.lua;;" LUA_CPATH="$prefix/lib/lua/5.4/?.so;;" \
            lua tests/test_rock.lua "$PWD"
          if command -v luajit >/dev/null; then
            LUA_PATH="$prefix/share/lua/5.1/?.lua;;" LUA_CPATH="$prefix/lib/lua/5.1/?.so;;" \
              luajit tests/test_rock.lua "$PWD"
          fi

  rock:
    name: luarocks ${{ matrix.lua }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lua: [lua5.4, luajit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-name: dseams
          create-args: >-
            c-compiler
            cxx-compiler
            meson
            ninja
            pkg-config
            python=3.12
            eigen
            libblas
            liblapack
            libhwy
            chemfiles
            rust
            lua=5.4
            luajit
          cache-environment: true
      - name: libseams
        shell: bash -el {0}
        run: |
          meson setup bbdir --prefix="$RUNNER_TEMP/seams" --libdir=lib -Dwith_lua=disabled -Dwith_tests=false
          meson compile -C bbdir
          meson install -C bbdir
      - name: LuaRocks for ${{ matrix.lua }}
        shell: bash -el {0}
        run: |
          root="$RUNNER_TEMP/lua-root"
          mkdir -p "$root/bin"
          if [ "${{ matrix.lua }}" = lua5.4 ]; then
            ln -s "$CONDA_PREFIX/bin/lua" "$root/bin/lua5.4"
            ln -s "$CONDA_PREFIX/include" "$root/include"
            flags="--lua-version=5.4 --with-lua-interpreter=lua5.4"
          else
            ln -s "$CONDA_PREFIX/bin/luajit" "$root/bin/luajit"
            ln -s "$CONDA_PREFIX/include/luajit-2.1" "$root/include"
            flags="--lua-version=5.1 --with-lua-interpreter=luajit"
          fi
          curl -fsSL -o luarocks.tar.gz "https://luarocks.github.io/luarocks/releases/luarocks-$LUAROCKS_VERSION.tar.gz"
          echo "$LUAROCKS_SHA256  luarocks.tar.gz" | sha256sum -c -
          tar -xzf luarocks.tar.gz
          (cd "luarocks-$LUAROCKS_VERSION" && ./configure --prefix="$RUNNER_TEMP/luarocks" --with-lua="$root" $flags && make && make install)
          rm -rf luarocks.tar.gz "luarocks-$LUAROCKS_VERSION"
          # A private root holds one interpreter, so LuaRocks cannot pick another.
          echo "LUAROCKS=$RUNNER_TEMP/luarocks/bin/luarocks --lua-dir=$root" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/seams/lib" >> "$GITHUB_ENV"
          echo "OMP_NUM_THREADS=1" >> "$GITHUB_ENV"
      - name: luarocks make, test and pack
        shell: bash -el {0}
        run: |
          tree="$RUNNER_TEMP/rocks"
          $LUAROCKS --tree "$tree" make dseams-2.14.0-1.rockspec \
            SEAMS_DIR="$RUNNER_TEMP/seams" SEAMS_LIBDIR="$RUNNER_TEMP/seams/lib"
          $LUAROCKS --tree "$tree" install fennel
          eval "$($LUAROCKS --tree "$tree" path)"
          $LUAROCKS --tree "$tree" test dseams-2.14.0-1.rockspec
          mkdir -p rocks
          (cd rocks && $LUAROCKS --tree "$tree" pack dseams 2.14.0-1)
      - name: Install the packed rock into a new tree
        shell: bash -el {0}
        run: |
          tree="$RUNNER_TEMP/fresh"
          $LUAROCKS --tree "$tree" install rocks/dseams-2.14.0-1.*.rock \
            SEAMS_DIR="$RUNNER_TEMP/seams" SEAMS_LIBDIR="$RUNNER_TEMP/seams/lib"
          $LUAROCKS --tree "$tree" install fennel
          eval "$($LUAROCKS --tree "$tree" path)"
          cd "$RUNNER_TEMP"
          $($LUAROCKS config variables.LUA) "$GITHUB_WORKSPACE/tests/test_rock.lua" "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rock-${{ matrix.lua }}
          path: rocks/*.rock
          retention-days: 7
